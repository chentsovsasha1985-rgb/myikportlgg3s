name: Dump core/e.smali onTransact

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Read core/e.smali
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          txt = open("qs_smali/smali/com/uei/control/core/e.smali").read()
          idx = txt.find("onTransact")
          part = txt[idx:]
          lines = [l.strip().replace(":", "=") for l in part.splitlines() if l.strip()]
          print("::error::" + " ; ".join(lines[:75])[:3500])
          exit(1)
          '
