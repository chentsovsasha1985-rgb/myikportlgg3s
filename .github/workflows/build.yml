name: Sign QuickSetSDK with AOSP platform key

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Build-Tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'build-tools;30.0.3'
      - name: Sign QuickSetSDK.apk with AOSP platform key
        run: |
          curl -fSL https://githubusercontent.com -o platform.x509.pem
          curl -fSL https://githubusercontent.com -o platform.pk8
          $ANDROID_HOME/build-tools/30.0.3/apksigner sign --key platform.pk8 --cert platform.x509.pem --out QuickSetSDK_signed.apk QuickSetSDK.apk
      - name: Publish Signed QuickSetSDK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: QuickSetSDK_signed.apk
