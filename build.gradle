buildscript {
    repositories {
        maven { url 'https://google.com' }
        maven { url 'https://aliyun.com' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.2.2'
    }
}

allprojects {
    repositories {
        maven { url 'https://google.com' }
        maven { url 'https://aliyun.com' }
        maven { url 'https://xposed.info' }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
