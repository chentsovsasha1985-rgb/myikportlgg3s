name: Inspect IControl in QuickSetSDK

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Dump IControl Stub transactions
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          files = glob.glob("qs_smali/**/IControl$Stub.smali", recursive=True) + glob.glob("qs_smali/**/IControl*.smali", recursive=True)
          out = []
          for f in files:
              txt = open(f).read()
              if "TRANSACTION_" in txt or "transmit" in txt.lower():
                  out.append(f + ":\n" + "\n".join([l.strip() for l in txt.splitlines() if "TRANSACTION_" in l or "method " in l or "const/16" in l or "const/4" in l][:40]))
          print("::error::" + " === ".join(out)[:3500])
          exit(1)
          '
