name: Inspect selinux_check_access in servicemanager

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils-arm-linux-gnueabi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-linux-gnueabi
      - name: Dump around selinux_check_access
        run: |
          arm-linux-gnueabi-objdump -d servicemanager > disasm.txt
          python3 -c '
          with open("disasm.txt") as f:
              lines = f.readlines()
          out = []
          for i, l in enumerate(lines):
              if "selinux_check_access" in l:
                  out.extend([x.strip() for x in lines[max(0, i-15):min(len(lines), i+15)]])
          print("::error::" + " | ".join(out))
          exit(1)
          '
