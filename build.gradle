buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.1.4'
    }
}

allprojects {
    repositories {
        google()
        maven { url 'https://xposed.info' }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
