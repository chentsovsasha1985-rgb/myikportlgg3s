name: Dump ZipIRWaveForm creation in f.smali

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Read ZipIRWaveForm call
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          lines = [l.strip().replace(":", "=") for l in open("qs_smali/smali/com/uei/b/f.smali") if l.strip()]
          for i, l in enumerate(lines):
              if "Converting patterns to learned data" in l:
                  print("::error::" + " ; ".join(lines[i+40:i+110])[:3800])
                  exit(1)
          '
