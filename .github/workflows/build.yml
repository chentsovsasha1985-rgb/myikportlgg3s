name: Dump method b(I[I) in f.smali

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Read b(I[I)
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          txt = open("qs_smali/smali/com/uei/b/f.smali").read()
          idx = txt.find(".method private b(I[I)Lcom/uei/quickset/ZipIRWaveForm;")
          lines = [l.strip().replace(":", "=") for l in txt[idx:idx+4500].splitlines() if l.strip()]
          print("::error::" + " ; ".join(lines[:75])[:3800])
          exit(1)
          '
