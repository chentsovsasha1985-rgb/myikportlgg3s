name: Build sepolicy-inject ARMv7

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sepolicy-inject
        uses: actions/checkout@v4
        with:
          repository: phhusson/sepolicy-inject
          submodules: recursive
      - name: Install flex & bison
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flex bison
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      - name: Build sepolicy-inject ARMv7
        run: |
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          export AR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/arm-linux-androideabi-ar"
          make -C libsepol/src CC="$CC" AR="$AR" CFLAGS="-O2 -I../include -D_GNU_SOURCE" libsepol.a
          $CC -static -O2 -Ilibsepol/include sepolicy-inject.c libsepol/src/libsepol.a -o sepolicy-inject
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: sepolicy-inject
