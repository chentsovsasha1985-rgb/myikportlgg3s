name: Build LG IR Xposed APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platforms;android-24 build-tools;24.0.3'
      - name: Switch to JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
        continue-on-error: true
        id: gradle_build
      - name: Print Error if Failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "::error::$(grep -E 'FAILURE:|What went wrong:|> Could not|> Failed|error:' build.log | tr '\n' ' ')"
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LG-IR-Xposed-Module
          path: app/build/outputs/apk/**/*.apk
