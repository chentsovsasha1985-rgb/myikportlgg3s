name: Dump ZipIRWaveForm builder in f.smali

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Read Converting patterns to learned data
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          out = []
          for f in glob.glob("qs_smali/**/*.smali", recursive=True):
              txt = open(f).read()
              if "Converting patterns to learned data" in txt:
                  lines = [l.strip().replace(":", "=") for l in txt.splitlines() if l.strip()]
                  for i, l in enumerate(lines):
                      if "Converting patterns to learned data" in l:
                          out.append(f.split("/")[-1] + " -> " + " ; ".join(lines[max(0, i-5):min(len(lines), i+45)]))
          print("::error::" + " || ".join(out)[:3800])
          exit(1)
          '
