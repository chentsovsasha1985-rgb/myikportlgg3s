name: Patch servicemanager ARMv7

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils-arm-linux-gnueabi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-linux-gnueabi
      - name: Inspect and Patch servicemanager
        run: |
          arm-linux-gnueabi-objdump -d servicemanager > disasm.txt
          python3 -c '
          import re, shutil
          with open("disasm.txt") as f:
              text = f.read()
          # Ищем функцию check_mac_perms или место вызова selinux_check_access
          m = re.search(r"([0-9a-f]+)\s+<([^>]*check_mac_perms[^>]*)>:", text)
          if not m:
              print("::error::Function not found, functions:", re.findall(r"<([^>]+)>:", text))
              exit(1)
          vaddr = int(m.group(1), 16)
          print(f"Found {m.group(2)} at vaddr 0x{vaddr:x}")
          # В PIE ELF для Android base offset = 0x0, проверяем секцию .text через readelf
          import subprocess
          out = subprocess.check_output(["arm-linux-gnueabi-readelf", "-S", "servicemanager"]).decode()
          tm = re.search(r"\.text\s+PROGBITS\s+([0-9a-f]+)\s+([0-9a-f]+)", out)
          t_vaddr, t_off = int(tm.group(1), 16), int(tm.group(2), 16)
          file_off = vaddr - t_vaddr + t_off
          print(f"Patching file offset 0x{file_off:x} (bytes: {open(\"servicemanager\",\"rb\").read()[file_off:file_off+4].hex()})")
          shutil.copy("servicemanager", "servicemanager_patched")
          with open("servicemanager_patched", "r+b") as f:
              f.seek(file_off)
              f.write(b"\x01\x20\x70\x47")
          '
      - name: Publish Patched servicemanager
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: servicemanager_patched
