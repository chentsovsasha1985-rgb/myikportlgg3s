name: Inspect IControl in QuickSetSDK

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Dump IControl onTransact
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          out = []
          for f in glob.glob("qs_smali/**/IControl*.smali", recursive=True):
              if "Callback" in f:
                  continue
              txt = open(f).read()
              lines = [l.strip().replace(":", "=") for l in txt.splitlines() if "0x1" in l or "createIntArray" in l or "readInt" in l or "invoke-virtual" in l]
              out.append(f + " -> " + " ; ".join(lines[:40]))
          print("::error::" + (" || ".join(out) if out else "NOT FOUND")[:3500])
          exit(1)
          '
