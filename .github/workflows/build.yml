name: Patch servicemanager PLT 0x8b8

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selinux_check_access@plt
        run: |
          python3 -c '
          import shutil
          data = open("servicemanager", "rb").read()
          # В PIE ELF для Android файл отображается с нулевого смещения: vaddr 0x8b8 == file offset 0x8b8
          file_off = 0x8b8
          orig = data[file_off:file_off+12]
          assert orig[:4] == b"\x00\xc6\x8f\xe2", f"Unexpected bytes at 0x8b8: {orig.hex()}"
          shutil.copy("servicemanager", "servicemanager_patched")
          with open("servicemanager_patched", "r+b") as f:
              f.seek(file_off)
              # ARM little-endian: mov r0, #0 (00 00 a0 e3) + bx lr (1e ff 2f e1)
              f.write(b"\x00\x00\xa0\xe3\x1e\xff\x2f\xe1")
          print(f"::notice::Verified and patched PLT 0x8b8 (was {orig.hex()})!")
          '
      - name: Publish Patched servicemanager
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: servicemanager_patched
