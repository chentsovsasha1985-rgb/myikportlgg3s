name: Patch servicemanager ARMv7

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils-arm-linux-gnueabi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-linux-gnueabi
      - name: Inspect and Patch servicemanager
        run: |
          arm-linux-gnueabi-objdump -d servicemanager > disasm.txt
          arm-linux-gnueabi-readelf -S servicemanager > elfinfo.txt
          python3 -c '
          import re, shutil
          with open("disasm.txt") as f:
              disasm = f.read()
          with open("elfinfo.txt") as f:
              elfinfo = f.read()
          tm = re.search(r"\.text\s+PROGBITS\s+([0-9a-f]+)\s+([0-9a-f]+)", elfinfo)
          t_vaddr, t_off = int(tm.group(1), 16), int(tm.group(2), 16)
          plt = re.search(r"([0-9a-f]+)\s+<selinux_check_access@plt>:", disasm)
          plt_short = plt.group(1).lstrip("0")
          calls = re.findall(rf"^\s*([0-9a-f]+):\s+([0-9a-f ]+)\s+blx?\s+{plt_short}\b", disasm, re.M)
          print("Found calls to selinux_check_access:", calls)
          if not calls:
              exit(1)
          shutil.copy("servicemanager", "servicemanager_patched")
          with open("servicemanager_patched", "r+b") as f:
              for addr_s, hex_bytes, *_ in calls:
                  vaddr = int(addr_s, 16)
                  file_off = vaddr - t_vaddr + t_off
                  raw = bytes.fromhex(hex_bytes.replace(" ", ""))
                  print(f"Patching vaddr=0x{vaddr:x} file_off=0x{file_off:x} len={len(raw)} bytes={raw.hex()}")
                  f.seek(file_off)
                  # Заменяем 4-байтовый bl/blx (Thumb-2 или ARM) на возврат r0 = 0 (разрешено)
                  if len(raw) == 4:
                      # В Thumb-2 little-endian: movs r0, #0 (00 20) + nop (00 bf)
                      f.write(b"\x00\x20\x00\xbf")
                  else:
                      exit(1)
          '
      - name: Publish Patched servicemanager
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: servicemanager_patched
