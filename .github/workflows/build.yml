name: Dump core/e.smali 1240-1310

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Read 1240-1310 in core/e.smali
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          lines = [l.strip().replace(":", "=") for l in open("qs_smali/smali/com/uei/control/core/e.smali") if l.strip()]
          part = [f"{i}={lines[i]}" for i in range(1240, 1310) if i < len(lines)]
          print("::error::" + " ; ".join(part)[:3500])
          exit(1)
          '
