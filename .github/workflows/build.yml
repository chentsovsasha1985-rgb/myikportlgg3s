name: Dump IControl switch in QuickSetSDK

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Find -----IControl
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          out = []
          for f in glob.glob("qs_smali/**/*.smali", recursive=True):
              txt = open(f).read()
              if "-----IControl:" in txt:
                  lines = [l.strip().replace(":", "=") for l in txt.splitlines() if "0x" in l or "createIntArray" in l or "readInt" in l or "invoke-" in l or "sparse-switch" in l]
                  out.append(f + " -> " + " ; ".join(lines[:55]))
          print("::error::" + " || ".join(out)[:3500])
          exit(1)
          '
