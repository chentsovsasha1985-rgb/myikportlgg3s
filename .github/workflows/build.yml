name: Inspect IControl in QuickSetSDK

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Dump IControl Stub transactions
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          out = []
          for f in glob.glob("qs_smali/**/*.smali", recursive=True):
              txt = open(f).read()
              if "TRANSACTION_" in txt:
                  lines = [l.strip() for l in txt.splitlines() if "TRANSACTION_" in l]
                  out.append(f.split("/")[-1] + ": " + ", ".join(lines))
          print("::error::" + " | ".join(out)[:3500])
          exit(1)
          '
