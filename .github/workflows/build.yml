name: Dump com/uei/b/h.smali

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Read h.smali
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          lines = [l.strip().replace(":", "=") for l in open("qs_smali/smali/com/uei/b/h.smali") if l.strip()]
          print("::error::" + " ; ".join(lines)[:3800])
          exit(1)
          '
