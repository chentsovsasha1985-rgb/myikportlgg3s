name: Build sepolicy-inject ARMv7

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sepolicy-inject
        uses: actions/checkout@v4
        with:
          repository: phhusson/sepolicy-inject
          submodules: recursive
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      - name: Build sepolicy-inject ARMv7
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=armeabi-v7a APP_PLATFORM=android-21 APP_LDFLAGS="-static"
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: libs/armeabi-v7a/sepolicy-inject
