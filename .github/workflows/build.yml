name: List com.uei.control files

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: List files and methods in com/uei/control
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          files = sorted(glob.glob("qs_smali/smali/com/uei/control/*.smali"))
          out = []
          for f in files:
              txt = open(f).read()
              sigs = [l.strip().replace(":", "=") for l in txt.splitlines() if "createIntArray" in l or "IControl:" in l or "const-string" in l]
              out.append(f.split("/")[-1] + "[" + "; ".join(sigs[:10]) + "]")
          print("::error::" + " | ".join(out)[:3500])
          exit(1)
          '
