name: Patch servicemanager avc_denied

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils-arm-linux-gnueabi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-linux-gnueabi
      - name: Find and Patch check_mac_perms
        run: |
          arm-linux-gnueabi-objdump -d servicemanager > disasm.txt
          python3 -c '
          import shutil
          data = open("servicemanager", "rb").read()
          # Находим строку "avc:  denied" в файле
          str_off = data.find(b"avc:  denied")
          assert str_off != -1, "String not found"
          # В ARM32 функция check_mac_perms загружает адрес этой строки через PC-relative ldr rX, [pc, #imm]
          # Выводим все функции в disasm.txt, где встречается ссылка на str_off или selinux
          with open("disasm.txt") as f:
              lines = f.readlines()
          hits = [l.strip() for l in lines if hex(str_off)[2:] in l or "selinux" in l or "avc" in l or "freecon" in l or "getpidcon" in l]
          print("::error::" + " | ".join(hits[:25]))
          exit(1)
          '
