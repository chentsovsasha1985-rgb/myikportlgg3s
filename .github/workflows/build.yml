name: Patch servicemanager PLT 0x8b8

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selinux_check_access@plt
        run: |
          python3 -c '
          import shutil
          data = open("servicemanager", "rb").read()
          # Находим все PLT-трамплины (00 c6 8f e2) с шагом 12 байт
          plts = [off for off in range(0, len(data) - 12, 4) if data[off:off+4] == b"\x00\xc6\x8f\xe2"]
          # На скриншоте objdump: freecon@plt=0x858, getpidcon@plt=0x8ac, selinux_check_access@plt=0x8b8, open@plt=0x8c4, ioctl@plt=0x8d0
          # Разница от freecon (0x858) до selinux_check_access (0x8b8) = 0x60 (ровно 8 записей по 12 байт)
          # Ищем запись, перед которой ровно 8 записей с шагом 12 байт и после которой ровно 2 записи с шагом 12 байт (open, ioctl)
          target = None
          for off in plts:
              if (off - 0x60) in plts and (off - 12) in plts and (off + 12) in plts and (off + 24) in plts and (off + 36) not in plts:
                  target = off
                  break
          assert target is not None, f"PLTs found: {[hex(x) for x in plts]}"
          shutil.copy("servicemanager", "servicemanager_patched")
          with open("servicemanager_patched", "r+b") as f:
              f.seek(target)
              f.write(b"\x00\x00\xa0\xe3\x1e\xff\x2f\xe1")
          print("Patched selinux_check_access@plt at", hex(target))
          '
      - name: Publish Patched servicemanager
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-lg
          name: LG G3s IR Xposed Module
          files: servicemanager_patched
