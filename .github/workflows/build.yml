name: Build LG IR Xposed APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit libs for Android Build Tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 zlib1g:i386 libncurses5:i386 || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: 'platforms;android-24 build-tools;27.0.3'
      - name: Switch to JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Build Xposed API 82 Stub JAR
        run: |
          mkdir -p stub/de/robv/android/xposed/callbacks app/libs
          cat << 'EOF' > stub/de/robv/android/xposed/XposedBridge.java
          package de.robv.android.xposed;
          import java.lang.reflect.Member;
          import java.util.Collections;
          import java.util.Set;
          public class XposedBridge {
              public static int getXposedVersion() { return 82; }
              public static void log(String text) {}
              public static void log(Throwable t) {}
              public static XC_MethodHook.Unhook hookMethod(Member hookMethod, XC_MethodHook callback) { return null; }
              public static Set<XC_MethodHook.Unhook> hookAllMethods(Class<?> hookClass, String methodName, XC_MethodHook callback) { return Collections.emptySet(); }
              public static Set<XC_MethodHook.Unhook> hookAllConstructors(Class<?> hookClass, XC_MethodHook callback) { return Collections.emptySet(); }
              public static Object invokeOriginalMethod(Member method, Object thisObject, Object[] args) throws Throwable { return null; }
          }
          EOF
          cat << 'EOF' > stub/de/robv/android/xposed/XC_MethodHook.java
          package de.robv.android.xposed;
          import java.lang.reflect.Member;
          public abstract class XC_MethodHook {
              public static class MethodHookParam {
                  public Member method;
                  public Object thisObject;
                  public Object[] args;
                  public Object getResult() { return null; }
                  public void setResult(Object result) {}
                  public Throwable getThrowable() { return null; }
                  public boolean hasThrowable() { return false; }
                  public void setThrowable(Throwable throwable) {}
                  public Object getResultOrThrowable() throws Throwable { return null; }
              }
              public class Unhook { public void unhook() {} }
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
          }
          EOF
          cat << 'EOF' > stub/de/robv/android/xposed/XC_MethodReplacement.java
          package de.robv.android.xposed;
          public abstract class XC_MethodReplacement extends XC_MethodHook {
              protected abstract Object replaceHookedMethod(MethodHookParam param) throws Throwable;
              public static XC_MethodReplacement returnConstant(final Object result) {
                  return new XC_MethodReplacement() {
                      protected Object replaceHookedMethod(MethodHookParam param) { return result; }
                  };
              }
              public static final XC_MethodReplacement DO_NOTHING = new XC_MethodReplacement() {
                  protected Object replaceHookedMethod(MethodHookParam param) { return null; }
              };
          }
          EOF
          cat << 'EOF' > stub/de/robv/android/xposed/XposedHelpers.java
          package de.robv.android.xposed;
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          public class XposedHelpers {
              public static Class<?> findClass(String className, ClassLoader classLoader) { return null; }
              public static Method findMethodExact(Class<?> clazz, String methodName, Object... parameterTypes) { return null; }
              public static Method findMethodExact(String className, ClassLoader classLoader, String methodName, Object... parameterTypes) { return null; }
              public static Constructor<?> findConstructorExact(Class<?> clazz, Object... parameterTypes) { return null; }
              public static Field findField(Class<?> clazz, String fieldName) { return null; }
              public static XC_MethodHook.Unhook findAndHookMethod(String className, ClassLoader classLoader, String methodName, Object... parameterTypesAndCallback) { return null; }
              public static XC_MethodHook.Unhook findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; }
              public static XC_MethodHook.Unhook findAndHookConstructor(String className, ClassLoader classLoader, Object... parameterTypesAndCallback) { return null; }
              public static XC_MethodHook.Unhook findAndHookConstructor(Class<?> clazz, Object... parameterTypesAndCallback) { return null; }
              public static Object getObjectField(Object obj, String fieldName) { return null; }
              public static void setObjectField(Object obj, String fieldName, Object value) {}
              public static Object getStaticObjectField(Class<?> clazz, String fieldName) { return null; }
              public static void setStaticObjectField(Class<?> clazz, String fieldName, Object value) {}
              public static Object callMethod(Object obj, String methodName, Object... args) { return null; }
              public static Object callStaticMethod(Class<?> clazz, String methodName, Object... args) { return null; }
              public static Object newInstance(Class<?> clazz, Object... args) { return null; }
          }
          EOF
          cat << 'EOF' > stub/de/robv/android/xposed/IXposedHookLoadPackage.java
          package de.robv.android.xposed;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF
          cat << 'EOF' > stub/de/robv/android/xposed/callbacks/XC_LoadPackage.java
          package de.robv.android.xposed.callbacks;
          import android.content.pm.ApplicationInfo;
          public abstract class XC_LoadPackage {
              public static final class LoadPackageParam {
                  public String packageName;
                  public String processName;
                  public ClassLoader classLoader;
                  public ApplicationInfo appInfo;
                  public boolean isFirstApplication;
              }
          }
          EOF
          javac -cp "$ANDROID_HOME/platforms/android-24/android.jar" stub/de/robv/android/xposed/*.java stub/de/robv/android/xposed/callbacks/*.java
          jar cf app/libs/api-82.jar -C stub .
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
        continue-on-error: true
        id: gradle_build
      - name: Print Error if Failed
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "::error::$(grep -E 'FAILURE:|What went wrong:|> Could not|> Failed|error:' build.log | tr '\n' ' ')"
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LG-IR-Xposed-Module
          path: app/build/outputs/apk/**/*.apk
