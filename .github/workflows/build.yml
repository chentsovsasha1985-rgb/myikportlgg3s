name: Dump IRRCPlayer JNI class in QuickSetSDK

on: [push, workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install apktool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - name: Find IRRCPlayer_setIRRCInfos
        run: |
          apktool d -f QuickSetSDK.apk -o qs_smali
          python3 -c '
          import glob
          out = []
          for f in glob.glob("qs_smali/**/*.smali", recursive=True):
              txt = open(f).read()
              if "IRRCPlayer_setIRRCInfos" in txt:
                  lines = [l.strip().replace(":", "=") for l in txt.splitlines() if l.strip()]
                  out.append(f + " -> " + " ; ".join(lines[:75]))
          print("::error::" + " || ".join(out)[:3800])
          exit(1)
          '
